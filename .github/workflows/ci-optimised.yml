# =============================================================================
# OPTIMISED PIPELINE
#
# Same work as ci-baseline.yml, same commit, same runner class. Both trigger on
# every push to main, so the comparison is fair by construction.
#
# The seven fixes, in the order the MEASUREMENT said to attack them - not the
# order intuition suggested:
#
#   1. Fixed sleeps -> readiness polling      (baseline: 85s, 38% of the run)
#   2. Dependency caching (Maven + pip)       (also removes the 24% variance)
#   3. One build instead of four              (verify once; jar passed between jobs)
#   4. Multi-stage Dockerfile + layer cache   (no recompile inside the image)
#   5. Parallel jobs                          (wall clock, not total work)
#   6. Fail-fast tiering                      (cheapest signal first)
#   7. compose --wait                         (wait for the healthcheck, not a guess)
#
# JOB GRAPH - the critical path is what matters, not the sum:
#
#     fast-tests ────────────┐
#                            ├──> blackbox ──┐
#     build-and-integration ─┤               ├──> publish
#                            └──> image ─────┘
# =============================================================================

name: CI (optimised)

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: optimised-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '21'

jobs:

  # ---------------------------------------------------------------- FIX 6
  # Cheapest signal first. 72 unit and slice tests, no Docker, no database.
  # Runs in PARALLEL with the integration job rather than before it: on the
  # happy path (most runs) parallel is faster, and GitHub cancels the
  # dependent jobs the moment this one fails, so fail-fast is preserved where
  # it actually saves anything.
  fast-tests:
    name: Fast tests (unit + slice)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # ------------------------------------------------------------- FIX 2
      # `cache: maven` is the whole difference. It keys on the pom hash and
      # restores ~/.m2, so the dependency tree is downloaded once ever rather
      # than once per run - which is also where all of the baseline's 24%
      # run-to-run variance lived.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Unit and slice tests
        working-directory: backend
        run: ./mvnw -B test

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: surefire-reports
          path: backend/target/surefire-reports/
          retention-days: 7
          if-no-files-found: warn

  # ---------------------------------------------------------------- FIX 3
  # ONE build produces the jar the rest of the pipeline uses. The baseline
  # compiled four times (clean test, clean verify, clean package, and again
  # inside Docker). Beyond the wasted minutes, four builds are four chances to
  # produce different bytes - so the artifact you tested is not provably the
  # artifact you shipped. "Build once, deploy everywhere" is a correctness
  # rule, not a performance tip.
  build-and-integration:
    name: Integration tests + package
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      # -DskipUnitTests=true: the fast-tests job is already running those,
      # concurrently. No `clean` - the runner is empty anyway, so `clean` can
      # only ever delete work that does not exist yet.
      - name: Integration tests and package
        working-directory: backend
        run: ./mvnw -B verify -DskipUnitTests=true

      - name: Derive version
        id: version
        run: echo "value=0.1.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      # The jar travels to the downstream jobs as an artifact. Jobs run on
      # separate machines and share no filesystem, so this is how "build once"
      # is actually achieved on GitHub Actions.
      - uses: actions/upload-artifact@v4
        with:
          name: application-jar
          path: backend/target/tool-registry.jar
          retention-days: 7

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: failsafe-reports
          path: backend/target/failsafe-reports/
          retention-days: 7
          if-no-files-found: warn

    outputs:
      version: ${{ steps.version.outputs.value }}

  # ---------------------------------------------------------- FIX 1 and 7
  # The big one. The baseline slept 85 seconds waiting for a database that was
  # ready in ~3 and an app that was up in ~8.
  blackbox:
    name: Black-box data-driven tests
    runs-on: ubuntu-latest
    needs: [fast-tests, build-and-integration]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: application-jar
          path: backend/target/

      # ------------------------------------------------------------- FIX 7
      # `--wait` blocks until the service's own healthcheck reports healthy.
      # The compose file already defines `pg_isready`; the baseline ignored it
      # and guessed 45 seconds instead.
      - name: Start PostgreSQL and wait for it to be healthy
        run: docker compose -f docker/docker-compose.yml up -d --wait postgres

      # ------------------------------------------------------------- FIX 1
      # Poll the readiness endpoint that exists precisely to answer
      # "are you ready?", instead of sleeping 40 seconds and hoping.
      - name: Start the Tool Registry and wait for readiness
        run: |
          nohup java -jar backend/target/tool-registry.jar > app.log 2>&1 &
          ./scripts/wait-for-http.sh http://localhost:8081/actuator/health/readiness 90 \
            || { echo '--- application log ---'; cat app.log; exit 1; }

      # ------------------------------------------------------------- FIX 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: integration-tests/requirements.txt

      - name: Install Python dependencies
        run: python -m pip install -r integration-tests/requirements.txt

      - name: Data-driven integration tests
        working-directory: integration-tests
        env:
          BASE_URL: http://localhost:8081
        run: python -m pytest --junitxml=reports/junit.xml

      # Dogfooding: the pipeline publishes its own build through the platform
      # it just built, exercising the DRAFT -> upload -> PUBLISHED release gate.
      - name: Register and publish this build in the Tool Registry
        env:
          VERSION: ${{ needs.build-and-integration.outputs.version }}
        run: |
          set -euo pipefail
          BASE=http://localhost:8081
          TOOL=tool-registry
          curl -sf -X POST "$BASE/api/v1/tools" -H 'Content-Type: application/json' \
            -d "{\"name\":\"$TOOL\",\"description\":\"The registry service itself\"}" \
            -o /dev/null -w 'register tool  : %{http_code}\n' || true
          curl -sf -X POST "$BASE/api/v1/tools/$TOOL/versions" -H 'Content-Type: application/json' \
            -d "{\"version\":\"$VERSION\",\"artifactPath\":\"$TOOL/$VERSION/$TOOL-$VERSION.jar\",\"status\":\"DRAFT\"}" \
            -o /dev/null -w 'register version: %{http_code}\n'
          curl -sf -X PUT "$BASE/api/v1/tools/$TOOL/versions/$VERSION/artifact" \
            -H 'Content-Type: application/octet-stream' \
            --data-binary @backend/target/tool-registry.jar \
            -o /dev/null -w 'upload artifact : %{http_code}\n'
          curl -sf -X POST "$BASE/api/v1/tools/$TOOL/versions/$VERSION/promotion" \
            -H 'Content-Type: application/json' -d '{"status":"PUBLISHED"}' \
            -o /dev/null -w 'promote         : %{http_code}\n'

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pytest-reports
          path: integration-tests/reports/
          retention-days: 7
          if-no-files-found: warn

  # ---------------------------------------------------------------- FIX 4
  # Runs in parallel with blackbox - neither needs the other.
  image:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: build-and-integration
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # buildx enables the layer cache backend. `type=gha` stores layers in
      # GitHub's own cache, so the dependency layer of the multi-stage
      # Dockerfile is restored instead of rebuilt - the baseline recompiled
      # the entire application inside the image on every single run.
      - uses: docker/setup-buildx-action@v3

      - name: Build image with layer caching
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: docker/Dockerfile
          tags: tool-registry:${{ needs.build-and-integration.outputs.version }}
          push: false
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Report image size
        run: docker images tool-registry --format '{{.Repository}}:{{.Tag}}  {{.Size}}'

  # --------------------------------------------------------------- publish
  # Gated on everything. Nothing is published unless every lane is green.
  publish:
    name: Publish artifact
    runs-on: ubuntu-latest
    needs: [blackbox, image, build-and-integration]
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: application-jar
          path: dist/

      - name: Publish to Artifactory
        env:
          ARTIFACTORY_URL: ${{ secrets.ARTIFACTORY_URL }}
          ARTIFACTORY_USERNAME: ${{ secrets.ARTIFACTORY_USERNAME }}
          ARTIFACTORY_PASSWORD: ${{ secrets.ARTIFACTORY_PASSWORD }}
          ARTIFACTORY_REPO: ${{ vars.ARTIFACTORY_REPO || 'internal-tools-local' }}
          VERSION: ${{ needs.build-and-integration.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "${ARTIFACTORY_URL:-}" ]; then
            echo "::notice::ARTIFACTORY_URL secret is not set - skipping the Artifactory publish."
            exit 0
          fi
          JAR=dist/tool-registry.jar
          SHA=$(sha256sum "$JAR" | cut -d' ' -f1)
          curl -sSf -u "$ARTIFACTORY_USERNAME:$ARTIFACTORY_PASSWORD" \
               -H "X-Checksum-Sha256: $SHA" -T "$JAR" \
               "$ARTIFACTORY_URL/artifactory/$ARTIFACTORY_REPO/tool-registry/$VERSION/tool-registry-$VERSION.jar"

      - name: Summary
        env:
          VERSION: ${{ needs.build-and-integration.outputs.version }}
        run: |
          {
            echo "### Release ${VERSION} :white_check_mark:"
            echo ""
            echo "| Lane | Result |"
            echo "|------|--------|"
            echo "| Unit + slice tests | passed |"
            echo "| Integration tests | passed |"
            echo "| Black-box data-driven tests | passed |"
            echo "| Docker image | built |"
            echo ""
            echo "SHA-256: \`$(sha256sum dist/tool-registry.jar | cut -d' ' -f1)\`"
          } >> "$GITHUB_STEP_SUMMARY"
