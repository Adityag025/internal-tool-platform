[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# -ra shows a summary of every non-passing outcome (including xfail reasons),
# so a CI log tells you what was skipped and why, not just the pass count.
addopts =
    -ra
    --strict-markers
    --tb=short
    --color=yes

markers =
    smoke: fast happy-path checks; run these first in CI
    negative: error paths and edge cases
    artifact: exercises real artifact bytes
    contract: asserts the RFC 7807 error contract
    slow: makes several round trips

# Fail a run that somehow collects nothing, rather than reporting success.
empty_parameter_set_mark = fail_at_collect
