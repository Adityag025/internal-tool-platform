spring:
  application:
    name: tool-registry

  datasource:
    # Every value can be overridden by an environment variable.
    # The defaults are LOCAL-DEV ONLY and are never used in CI or AWS.
    url: ${DB_URL:jdbc:postgresql://localhost:5433/toolplatform}
    username: ${DB_USERNAME:toolplatform}
    password: ${DB_PASSWORD:localdev}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}

  jpa:
    # Hibernate must NEVER create or alter the schema. Flyway owns it.
    # `validate` makes the app refuse to start if the entities and the
    # migrated schema have drifted apart - a loud failure instead of a
    # silent production mismatch.
    hibernate:
      ddl-auto: validate
    # Close the persistence session at the end of the service call, not at the
    # end of the HTTP response. Forces us to be explicit about what we load.
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

# ---------------------------------------------------------------- platform
platform:
  # Origins allowed to call this API from a browser. Empty = CORS off, which
  # is the right default for a service with no browser client. Never "*".
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

  artifacts:
    # filesystem | artifactory. Local dev and CI use filesystem so neither
    # needs a running Artifactory; the artifactory profile exercises the real
    # adapter. Same code path either way.
    store: ${ARTIFACT_STORE:filesystem}
    max-artifact-bytes: 104857600   # 100 MB

    filesystem:
      root: ${ARTIFACT_ROOT:./data/artifacts}

    artifactory:
      # NO DEFAULTS for credentials, on purpose. If they are missing the app
      # refuses to start rather than silently running unauthenticated.
      base-url: ${ARTIFACTORY_URL:}
      repository: ${ARTIFACTORY_REPO:internal-tools-local}
      username: ${ARTIFACTORY_USERNAME:}
      password: ${ARTIFACTORY_PASSWORD:}

server:
  port: ${SERVER_PORT:8081}
  error:
    include-message: never   # error bodies come from GlobalExceptionHandler only

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true          # /actuator/health/liveness + /readiness for ECS & k8s

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%X{requestId:-no-request}] %logger{32} - %msg%n"
  level:
    com.acme.toolplatform: ${LOG_LEVEL:INFO}
