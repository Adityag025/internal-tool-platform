# Phase 1 local stack: PostgreSQL only.
#
# The Spring Boot app still runs on your HOST (via ./mvnw spring-boot:run) in
# this phase, so it connects to localhost:5432 - that is correct, because the
# port is published from the container to the host.
#
# From Phase 7 the app itself moves into this compose file and will connect to
# "postgres:5432" instead. See docs/architecture.md - "Container networking".

name: tool-platform

services:
  postgres:
    image: postgres:16-alpine
    container_name: tool-platform-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-toolplatform}
      POSTGRES_USER: ${POSTGRES_USER:-toolplatform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-localdev}
    ports:
      # host:container - only needed while the app runs outside Docker.
      # 5433 on the host because this machine already runs another Postgres
      # on 5432. INSIDE the compose network the port is always 5432.
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # Other services must wait for "ready to accept connections", not just
      # for the container to exist. A started container is not a ready database.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-toolplatform} -d ${POSTGRES_DB:-toolplatform}"]
      interval: 5s
      timeout: 5s
      retries: 20
    # Survives a host reboot. Without it the database silently stays down and
    # the next thing you run fails with "connection refused" for no visible
    # reason - which happened on this machine between two work sessions.
    restart: unless-stopped
    networks:
      - platform-net

  # ---------------------------------------------------------------------
  # The Tool Registry service itself.
  #
  # CONTAINER NETWORKING - the single most important line in this file:
  #
  #     jdbc:postgresql://postgres:5432/toolplatform
  #                       ^^^^^^^^ ^^^^
  #                       service   the CONTAINER's port, not the host's
  #                       name
  #
  # NOT localhost:5433. Inside a container, `localhost` is that container's own
  # loopback interface - there is no PostgreSQL listening there, so the
  # connection is refused. Docker's embedded DNS resolves the service name
  # `postgres` to the container's current IP, which is essential because that
  # IP changes on every restart.
  #
  # And 5432, not 5433: the 5433 mapping publishes the port to the HOST. It is
  # irrelevant between containers, which talk on the internal network using the
  # container's real port.
  # ---------------------------------------------------------------------
  app:
    build:
      context: ../backend
      dockerfile: ../docker/Dockerfile
    container_name: tool-platform-app
    depends_on:
      postgres:
        # Not just "started" - wait until pg_isready passes. A started
        # container is not a ready database, and Flyway will fail on a
        # PostgreSQL that is still coming up.
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/toolplatform
      DB_USERNAME: ${POSTGRES_USER:-toolplatform}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-localdev}
      SERVER_PORT: 8081
      ARTIFACT_ROOT: /var/lib/tool-platform/artifacts
      CORS_ALLOWED_ORIGINS: http://localhost:${FRONTEND_HOST_PORT:-3000}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ENVIRONMENT: ${ENVIRONMENT:-local}
      # Empty by default: writes are open locally and the service says so
      # loudly at start-up. Set API_KEY in .env to require it.
      API_KEY: ${API_KEY:-}
    ports:
      - "${APP_HOST_PORT:-8081}:8081"
    volumes:
      - artifact-data:/var/lib/tool-platform/artifacts
    restart: unless-stopped
    networks:
      - platform-net

  # ---------------------------------------------------------------------
  # The small TypeScript dashboard, served as static files.
  # Run `npm --prefix ../frontend run build` first.
  # ---------------------------------------------------------------------
  frontend:
    image: nginx:1.27-alpine
    container_name: tool-platform-frontend
    depends_on:
      - app
    ports:
      - "${FRONTEND_HOST_PORT:-3000}:80"
    volumes:
      # Read-only: the container never needs to modify what it serves.
      - ../frontend/index.html:/usr/share/nginx/html/index.html:ro
      - ../frontend/dist:/usr/share/nginx/html/dist:ro
    restart: unless-stopped
    networks:
      - platform-net

  # ---------------------------------------------------------------------
  # JFrog Artifactory OSS - the real artifact repository.
  #
  # Started under a compose PROFILE, so `docker compose up -d` gives you just
  # PostgreSQL (fast, ~200MB) and only `--profile artifactory up -d` pulls in
  # this 3.8GB service. Day-to-day development and CI use the filesystem
  # adapter and never need it running.
  # ---------------------------------------------------------------------
  artifactory:
    image: releases-docker.jfrog.io/jfrog/artifactory-oss:7.98.17
    container_name: tool-platform-artifactory
    profiles: ["artifactory"]
    ports:
      # 8082 is the JFrog router (UI + REST). Host 8082 to avoid our app on 8081.
      - "${ARTIFACTORY_HOST_PORT:-8182}:8082"
    volumes:
      - artifactory-data:/var/opt/jfrog/artifactory
    environment:
      # Artifactory encrypts stored credentials with a master key. On a fresh
      # volume it has none and refuses to boot, so we supply one explicitly.
      # It lives in .env (gitignored) - losing it makes stored secrets
      # unreadable, which is exactly why it is a secret and not a default.
      # Empty default, NOT the ${VAR:?error} form.
      #
      # Compose interpolates the ENTIRE file before it applies profiles, so a
      # required-variable marker here fails `docker compose up postgres` too -
      # even though this service is not being started. That broke CI before CI
      # existed. Artifactory reports its own clear error if the key is absent
      # (see docs/artifactory.md section 10); set both keys in .env.
      JF_SHARED_SECURITY_MASTERKEY: ${ARTIFACTORY_MASTER_KEY:-}
      # The microservices inside the container authenticate to each other with
      # the join key. Both keys are required on a fresh volume; supplying only
      # one gets you a FATAL a few minutes into boot.
      JF_SHARED_SECURITY_JOINKEY: ${ARTIFACTORY_JOIN_KEY:-}
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8082/router/api/v1/system/health || exit 1"]
      interval: 10s
      timeout: 5s
      # Artifactory is slow to boot (2-4 minutes on first run) - a short
      # retry budget would mark it unhealthy while it is still starting.
      retries: 40
      start_period: 120s
    networks:
      - platform-net

volumes:
  postgres-data:
  artifact-data:
  artifactory-data:

networks:
  platform-net:
    driver: bridge
